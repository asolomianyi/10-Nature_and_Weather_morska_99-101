<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Nature and Weather Lesson</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&display=swap">
<style>
/* Layout: sticky step rail on top, one exercise "card sheet" at a time, like turning workbook pages */
:root{
  --bg:#EEF3F1; --paper:#FFFFFF; --ink:#16302A; --muted:#5A716A; --line:#CFDDD8;
  --leaf:#1F7A5A; --leaf-soft:#DCEFE6; --sky:#2F6FA8; --sky-soft:#E0ECF7;
  --sun:#F2C230; --sun-soft:#FFF4CC; --ok:#1E8A4C; --ok-soft:#DDF3E5; --bad:#C2412D; --bad-soft:#FBE3DE;
  --display:"Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --body:"Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0F1A17; --paper:#17251F; --ink:#E4EFEA; --muted:#93AAA2; --line:#2B3E37;
  --leaf:#5CC79A; --leaf-soft:#1D3A2E; --sky:#7FB3E6; --sky-soft:#1B2C3D;
  --sun:#F2C230; --sun-soft:#3A3216; --ok:#5BD08A; --ok-soft:#173A26; --bad:#F08A76; --bad-soft:#3E1F1A; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F1A17; --paper:#17251F; --ink:#E4EFEA; --muted:#93AAA2; --line:#2B3E37;
  --leaf:#5CC79A; --leaf-soft:#1D3A2E; --sky:#7FB3E6; --sky-soft:#1B2C3D;
  --sun:#F2C230; --sun-soft:#3A3216; --ok:#5BD08A; --ok-soft:#173A26; --bad:#F08A76; --bad-soft:#3E1F1A; color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:18px;line-height:1.5;margin:0}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--paper)}
.wrap{max-width:980px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.ua{display:block;font-size:.78em;color:var(--muted);font-weight:400;font-family:var(--body);letter-spacing:0;text-transform:none}
.ua-i{font-size:.85em;color:var(--muted)}

header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--paper);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:16px;padding-block:10px}
.brand{font-family:var(--display);font-weight:800;font-size:15px;letter-spacing:.06em;text-transform:uppercase;color:var(--leaf);white-space:nowrap}
.steps{display:flex;gap:6px;overflow-x:auto;flex:1;min-width:0;scrollbar-width:thin;padding-bottom:2px}
.steps button{flex:0 0 auto;font:600 14px var(--body);border:1px solid var(--line);background:transparent;color:var(--ink);border-radius:999px;padding:6px 12px;cursor:pointer;white-space:nowrap}
.steps button[aria-current="true"]{background:var(--leaf);border-color:var(--leaf);color:var(--paper)}
.steps button .tick{color:var(--ok);margin-left:4px}
.steps button[aria-current="true"] .tick{color:var(--sun)}
.total{font:700 14px var(--body);font-variant-numeric:tabular-nums;white-space:nowrap;background:var(--sun-soft);border-radius:8px;padding:5px 10px}

.hero{padding-block:36px 8px}
.unit{font:700 13px var(--body);letter-spacing:.14em;text-transform:uppercase;color:var(--sky)}
h1{font-family:var(--display);font-weight:800;font-size:clamp(34px,6vw,58px);line-height:1;margin:.15em 0 .1em;text-wrap:balance}
h1 em{font-style:normal;color:var(--leaf)}
.hero p{margin:.4em 0 0;max-width:62ch;color:var(--muted)}

section.sheet{padding-block:22px 48px}
.sheet-head{display:flex;gap:14px;align-items:flex-start;margin-bottom:18px}
.num{flex:0 0 auto;width:52px;height:52px;border-radius:14px;background:var(--sun);color:#2A2205;display:grid;place-items:center;font:800 24px var(--display)}
h2{font-family:var(--display);font-weight:700;font-size:clamp(22px,3.2vw,30px);line-height:1.15;margin:2px 0 0;text-wrap:balance}
.how{background:var(--sky-soft);border-radius:12px;padding:12px 16px;margin-bottom:18px;font-size:16px}
.how b{color:var(--sky)}

.card{background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:20px}
.bank{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px}
.chip{font:600 16px var(--body);border:1.5px dashed var(--leaf);color:var(--leaf);border-radius:999px;padding:4px 12px;background:transparent}
.chip.star{border-color:var(--sun);color:var(--ink);background:var(--sun-soft)}
ol.items{margin:0;padding-left:0;list-style:none;display:grid;gap:12px;counter-reset:q}
ol.items>li{counter-increment:q;display:grid;grid-template-columns:2.2em 1fr;gap:6px;align-items:baseline}
ol.items>li::before{content:counter(q)".";font-weight:700;color:var(--muted);font-variant-numeric:tabular-nums;text-align:right;padding-right:6px}
ol.items>li>div{min-width:0}

select,input.typed{font:600 17px var(--body);color:var(--ink);background:var(--bg);border:2px solid var(--line);border-radius:8px;padding:3px 8px;max-width:100%}
input.typed{width:9.5em}
select:focus-visible,input:focus-visible,button:focus-visible{outline:3px solid var(--sky);outline-offset:2px}
.ok{border-color:var(--ok)!important;background:var(--ok-soft)!important}
.bad{border-color:var(--bad)!important;background:var(--bad-soft)!important}
.fix{font-size:15px;color:var(--bad);font-weight:700;margin-left:6px}
.note{display:block;font-size:15px;color:var(--muted);margin-top:4px}

.bar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-top:20px}
.btn{font:700 16px var(--body);border-radius:10px;padding:10px 18px;cursor:pointer;border:2px solid var(--leaf);background:var(--leaf);color:var(--paper)}
.btn.ghost{background:transparent;color:var(--leaf)}
.btn.plain{border-color:var(--line);background:transparent;color:var(--muted)}
.result{font:700 17px var(--body);font-variant-numeric:tabular-nums;margin-left:auto}
.result:empty{display:none}
.pager{display:flex;justify-content:space-between;gap:10px;margin-top:28px}

/* warm-up sorting */
.pool{display:flex;flex-wrap:wrap;gap:8px;min-height:48px;margin-bottom:18px}
.word{font:700 17px var(--body);border:2px solid var(--line);background:var(--paper);color:var(--ink);border-radius:10px;padding:6px 12px;cursor:pointer}
.word[aria-pressed="true"]{border-color:var(--sun);background:var(--sun-soft);box-shadow:0 0 0 3px var(--sun-soft)}
.word.shake{animation:shake .35s;border-color:var(--bad)}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.bins{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
.bin{border:2px solid var(--line);border-radius:14px;padding:12px;background:var(--paper);cursor:pointer;text-align:left;font:inherit;color:inherit;min-height:120px;display:flex;flex-direction:column;gap:8px}
.bin:hover{border-color:var(--leaf)}
.bin h3{margin:0;font:700 17px var(--display)}
.bin .placed{display:flex;flex-wrap:wrap;gap:6px}
.bin .placed span{font-size:15px;background:var(--leaf-soft);border-radius:6px;padding:2px 8px}
.bin .placed small{color:var(--muted)}

/* idioms */
.pair{display:inline-flex;gap:6px;vertical-align:baseline;flex-wrap:wrap}
.opt{font:700 16px var(--body);border:2px solid var(--line);background:var(--bg);color:var(--ink);border-radius:8px;padding:2px 10px;cursor:pointer}
.opt[aria-pressed="true"]{border-color:var(--sky);background:var(--sky-soft)}
.meaning{display:block;margin-top:6px;font-size:15px;background:var(--sun-soft);border-radius:8px;padding:6px 10px}
.meaning[hidden]{display:none}

/* pictures */
.pics{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:14px}
.pic{display:flex;flex-direction:column;gap:8px}
.pic figure{margin:0;background:#fff;border-radius:12px;overflow:hidden;border:1px solid var(--line);aspect-ratio:1/1;display:grid;place-items:center}
.pic img{width:100%;height:100%;object-fit:contain}
.pic label{font-weight:700;color:var(--muted);font-size:15px}
.pic select{width:100%}

/* news */
.news{display:grid;gap:16px}
.news article{background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:20px;line-height:2}
.news .tag{font:700 12px var(--body);letter-spacing:.12em;text-transform:uppercase;color:var(--bad);display:block;line-height:1.5;margin-bottom:4px}
.news h3{font:700 20px var(--display);margin:0 0 6px;line-height:1.25}

/* study */
.study{display:grid;grid-template-columns:minmax(0,300px) minmax(0,1fr);gap:20px;align-items:start}
.study .diagram{background:#fff;border-radius:16px;border:1px solid var(--line);padding:10px}
.gloss{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:6px 16px;margin:0}
.gloss div{display:flex;justify-content:space-between;gap:8px;border-bottom:1px dotted var(--line);padding:4px 0}
.gloss dt{font-weight:700;line-height:1.25}.gloss dd{margin:0;color:var(--muted);text-align:right}
h3.sub{font:700 19px var(--display);margin:22px 0 10px}
.trees{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:12px}
.tree{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:8px;display:flex;flex-direction:column;gap:8px}
.tree figure{margin:0;background:#fff;border-radius:10px;aspect-ratio:4/5;display:grid;place-items:center;overflow:hidden}
.tree img{max-height:100%;object-fit:contain}
.tree select{width:100%}
.mode{display:inline-flex;border:2px solid var(--line);border-radius:10px;overflow:hidden;margin-bottom:12px}
.mode button{font:700 15px var(--body);border:0;background:transparent;color:var(--muted);padding:6px 14px;cursor:pointer}
.mode button[aria-pressed="true"]{background:var(--leaf);color:var(--paper)}
.tree .name{font-weight:700;text-align:center}
.tree .name small{display:block;font-weight:400;color:var(--muted)}
.ipa{display:block;font-family:"Noto Sans","Segoe UI","Arial Unicode MS",sans-serif;font-weight:400;font-size:.88em;color:var(--sky)}
.tree .name .ipa{margin-top:2px}

.final{background:var(--leaf);color:var(--paper);border-radius:18px;padding:22px;display:flex;flex-wrap:wrap;gap:16px;align-items:center;justify-content:space-between;margin-top:8px}
.final strong{font:800 34px var(--display);font-variant-numeric:tabular-nums}

@media (max-width:700px){
  body{font-size:17px}
  .study{grid-template-columns:1fr}
  .study .diagram{max-width:320px}
  .brand{display:none}
  .result{margin-left:0;width:100%}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

const shuffle=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};

const scores={}; // id -> [got, max]
function setScore(id,got,max){scores[id]=[got,max];renderTotal();const r=$("#res-"+id);if(r)r.textContent=`Score: ${got} / ${max}`;}
function renderTotal(){let g=0,m=0;for(const[a,b]of Object.values(scores)){g+=a;m+=b}$("#total").textContent=`${g} / ${m||MAXTOTAL}`;STEPS.forEach((s,i)=>{const t=$("#stepbtn-"+i+" .tick");if(t)t.textContent=scores[s.id]&&scores[s.id][0]===scores[s.id][1]?"✓":""});const f=$("#final-score");if(f)f.textContent=`${g} / ${MAXTOTAL}`}

function sheet(id,num,title,ua,how,howUa){
  const s=h("section",{class:"sheet",id:"sheet-"+id});
  s.append(h("div",{class:"sheet-head"},h("div",{class:"num"},num),h("h2",{},title,h("span",{class:"ua"},ua))));
  if(how)s.append(h("div",{class:"how",html:how+`<span class="ua">${howUa}</span>`}));
  return s;
}
function bar(id,onCheck,onShow,onReset){

}

const CATS=[
  {name:"Weather",ua:"Погода",words:[["drizzle","мряка"],["frost","іній, мороз"],["humidity","вологість"]]},
  {name:"Natural disasters",ua:"Стихійні лиха",words:[["avalanche","лавина"],["drought","посуха"],["famine","голод"]]},
  {name:"Plant world",ua:"Світ рослин",words:[["moss","мох"],["thistle","будяк"],["nettle","кропива"]]},
  {name:"The environment",ua:"Довкілля",words:[["pollutant","забруднювач"],["fossil fuels","викопне паливо"],["ozone layer","озоновий шар"]]},
  {name:"Animal world",ua:"Світ тварин",words:[["nocturnal","нічний (тварина)"],["rodents","гризуни"],["marsupials","сумчасті"]]},
];
function buildWarm(){
  const s=sheet("warm","★","Warm-up: sort the words","Розминка: розклади слова за темами",
    "<b>Tap a word</b>, then <b>tap the box</b> where it belongs. A right answer shows the Ukrainian meaning.",
    "Натисни на слово, потім на рамку, куди воно належить. Правильна відповідь покаже переклад.");
  const card=h("div",{class:"card"});
  const pool=h("div",{class:"pool",id:"pool"});
  const bins=h("div",{class:"bins"});
  let picked=null, got=0, tries=0;
  const total=CATS.reduce((n,c)=>n+c.words.length,0);
  function reset(){
    pool.innerHTML="";bins.innerHTML="";picked=null;got=0;tries=0;$("#res-warm")&&( $("#res-warm").textContent="");
    const all=shuffle(CATS.flatMap((c,ci)=>c.words.map(w=>({w:w[0],ua:w[1],ci}))));
    all.forEach(item=>{const b=h("button",{class:"word","aria-pressed":"false"},item.w);b._item=item;b.onclick=()=>{pool.querySelectorAll(".word").forEach(x=>x.setAttribute("aria-pressed","false"));picked=b;b.setAttribute("aria-pressed","true")};pool.append(b)});
    CATS.forEach((c,ci)=>{const placed=h("div",{class:"placed"});const bin=h("button",{class:"bin"},h("h3",{},c.name,h("span",{class:"ua"},c.ua)),placed);bin.onclick=()=>{
      if(!picked)return;tries++;
      if(picked._item.ci===ci){placed.append(h("span",{},picked._item.w+" ",h("small",{},"— "+picked._item.ua)));picked.remove();picked=null;got++;
        if(got===total){setScore("warm",Math.max(0,total-(tries-total)),total)} else $("#res-warm").textContent=`${got} / ${total} placed`;}
      else{const p=picked;p.classList.remove("shake");void p.offsetWidth;p.classList.add("shake")}
    };bins.append(bin)});
  }
  card.append(pool,bins,h("div",{class:"bar"},h("button",{class:"btn plain",onclick:reset},"Shuffle again"),h("span",{class:"result",id:"res-warm","aria-live":"polite"})),
    h("p",{class:"note"},"Score = words placed on the first try. ",h("span",{class:"ua-i"},"Бали = слова, розкладені з першої спроби.")));
  s.append(card);
  queueMicrotask(reset);
  return s;
}
